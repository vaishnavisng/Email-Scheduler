# Backing services expose healthchecks; app services wait on them via
# service_healthy, and on the one-shot migrate init container via
# service_completed_successfully. Container-to-container traffic uses service
# names (never localhost); only web's NEXT_PUBLIC_API_URL is a host URL.
# Every published host port is overridable via ${VAR:-default}.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outbox}
      POSTGRES_DB: ${POSTGRES_DB:-outbox}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-outbox} -d ${POSTGRES_DB:-outbox}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '${ES_PORT:-9200}:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -f http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # One-shot init container: applies migrations and provisions Ethereal senders,
  # then exits. Reuses the api image and overrides the command. Dependents gate
  # on its clean completion.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', 'bootstrap']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-outbox}:${POSTGRES_PASSWORD:-outbox}@postgres:5432/${POSTGRES_DB:-outbox}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Match the API so the demo JWT logged here validates against it.
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      # Optional offline fallback if Ethereal's account API is unreachable.
      ETHEREAL_USER_1: ${ETHEREAL_USER_1:-}
      ETHEREAL_PASS_1: ${ETHEREAL_PASS_1:-}
      ETHEREAL_USER_2: ${ETHEREAL_USER_2:-}
      ETHEREAL_PASS_2: ${ETHEREAL_PASS_2:-}
      ETHEREAL_USER_3: ${ETHEREAL_USER_3:-}
      ETHEREAL_PASS_3: ${ETHEREAL_PASS_3:-}
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for ES so the emails index is created with its explicit mapping at
      # boot; bootstrap degrades gracefully if it's still unreachable.
      elasticsearch:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-outbox}:${POSTGRES_PASSWORD:-outbox}@postgres:5432/${POSTGRES_DB:-outbox}
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      API_PORT: '4000'
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      MIN_DELAY_BETWEEN_EMAILS_MS: ${MIN_DELAY_BETWEEN_EMAILS_MS:-2000}
      MAX_EMAILS_PER_HOUR_PER_SENDER: ${MAX_EMAILS_PER_HOUR_PER_SENDER:-200}
      MAX_EMAILS_PER_HOUR_GLOBAL: ${MAX_EMAILS_PER_HOUR_GLOBAL:-1000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-3600000}
      STALLED_SEND_THRESHOLD_MS: ${STALLED_SEND_THRESHOLD_MS:-120000}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      BULLBOARD_USER: ${BULLBOARD_USER:-admin}
      BULLBOARD_PASS: ${BULLBOARD_PASS:-admin}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:4000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-outbox}:${POSTGRES_PASSWORD:-outbox}@postgres:5432/${POSTGRES_DB:-outbox}
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      MIN_DELAY_BETWEEN_EMAILS_MS: ${MIN_DELAY_BETWEEN_EMAILS_MS:-2000}
      MAX_EMAILS_PER_HOUR_PER_SENDER: ${MAX_EMAILS_PER_HOUR_PER_SENDER:-200}
      MAX_EMAILS_PER_HOUR_GLOBAL: ${MAX_EMAILS_PER_HOUR_GLOBAL:-1000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-3600000}
      STALLED_SEND_THRESHOLD_MS: ${STALLED_SEND_THRESHOLD_MS:-120000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      WEB_PORT: '3000'
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: next dev binds IPv4-only, but localhost
      # resolves to ::1 first inside the container.
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  pgdata:
  redisdata:
